networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24

services:
  server:
    image: gcc:13
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "apt-get update && apt-get install -y libssl-dev && make server && ./server"
    networks:
      lan:
        ipv4_address: 172.23.0.10
    mac_address: "02:00:00:00:00:10"
    ports:
      - "8000:8000"

  client:
    image: gcc:13
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "apt-get update && apt-get install -y libssl-dev && make client && ./client"
    networks:
      lan:
        ipv4_address: 172.23.0.20
    mac_address: "02:00:00:00:00:20"
    sysctls:
      - net.ipv4.conf.all.arp_accept=1
    stdin_open: true
    tty: true
    depends_on:
      - server
      # - mallory

  client2:
    image: gcc:13
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "apt-get update && apt-get install -y libssl-dev && make client && ./client"
    networks:
      lan:
        ipv4_address: 172.23.0.21
    mac_address: "02:00:00:00:00:21"
    stdin_open: true
    tty: true
    depends_on:
      - server

