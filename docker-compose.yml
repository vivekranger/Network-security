  wireshark:
    image: ghcr.io/linuxserver/wireshark:latest
    volumes:
      - .:/config/captures
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "3000:3000"
    networks:
      lan:
        ipv4_address: 172.23.0.40
    mac_address: "02:00:00:00:00:40"
